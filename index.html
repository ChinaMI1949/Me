/* 悬浮微型播放器 - SVG图形图标 */
.floating-music-player {
  position: fixed;
  bottom: 100px;
  right: 20px;
  z-index: 9999;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 50px;
  height: 50px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  cursor: pointer;
  user-select: none;
}
.floating-music-player:hover {
  transform: scale(1.1);
  box-shadow: 0 6px 28px rgba(0,0,0,0.25);
}
.floating-music-player svg {
  width: 22px;
  height: 22px;
  fill: var(--primary);
  transition: fill 0.3s;
}
.floating-music-player:hover svg {
  fill: var(--primary-dark);
}
.floating-music-player .now-playing {
  position: absolute;
  bottom: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.5rem;
  color: var(--text-light);
  white-space: nowrap;
  opacity: 0.7;
  letter-spacing: 0.3px;
  font-weight: 500;
}
.floating-music-player .pulse-ring {
  position: absolute;
  top: -4px;
  left: -4px;
  right: -4px;
  bottom: -4px;
  border-radius: 50%;
  border: 2px solid var(--primary);
  opacity: 0;
  animation: none;
  pointer-events: none;
}
.floating-music-player.is-playing .pulse-ring {
  animation: pulse-ring 1.5s ease-out infinite;
}
@keyframes pulse-ring {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(1.3); opacity: 0; }
}
/* 播放提示 */
.play-hint {
  position: fixed;
  bottom: 160px;
  right: 20px;
  z-index: 9998;
  background: var(--primary);
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 500;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
  white-space: nowrap;
  font-family: var(--font);
}
.play-hint.show {
  opacity: 1;
}
@media print { .floating-music-player { display: none !important; } .play-hint { display: none !important; } }
@media(max-width:480px){
  .floating-music-player { width: 44px; height: 44px; bottom: 90px; right: 12px; }
  .floating-music-player svg { width: 18px; height: 18px; }
  .floating-music-player .now-playing { font-size: 0.4rem; bottom: -18px; }
  .play-hint { bottom: 145px; right: 12px; font-size: 0.6rem; padding: 4px 12px; }
}

function renderExperiences(){

  }
  nav.innerHTML = items.map(function(_, i) {
    return '<button role="tab" id="exp-tab-' + i + '" aria-controls="exp-panel-' + i + '" aria-selected="' + (i === 0 ? 'true' : 'false') + '" tabindex="' + (i === 0 ? '0' : '-1') + '">' + (_.company || '&#x7ECF;&#x5386;') + '</button>';

  panels.innerHTML = items.map(function(exp, i) {
    return '<div class="tab-panel ' + (i === 0 ? 'active' : '') + '" role="tabpanel" id="exp-panel-' + i + '">' +
      '<div class="exp-item">' +
        '<div class="exp-left">' + exp.company +
          '<span class="date">' + (exp.date || '') + '</span>' +
          '<div style="font-weight:400;font-size:.9rem;color:var(--text-light);">' + (exp.role || '') + '</div>' +
        '</div>' +
        '<div class="exp-right">' +
          '<ul>' + exp.details.map(function(d) { return '<li>' + d + '</li>'; }).join('') + '</ul>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
  document.querySelectorAll('#expTabsNav [role="tab"]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var p = this.closest('.tabs-wrapper');
      p.querySelectorAll('[role="tab"]').forEach(function(b) {
        b.setAttribute('aria-selected', 'false');
        b.tabIndex = -1;
      });
      this.setAttribute('aria-selected', 'true');
      this.tabIndex = 0;
      var id = this.getAttribute('aria-controls');
      p.querySelectorAll('[role="tabpanel"]').forEach(function(pp) {
        pp.classList.remove('active');
      });
      document.getElementById(id).classList.add('active');
    });
    btn.addEventListener('keydown', function(e) {
      var p = this.closest('.tabs-wrapper');
      var tabs = [].slice.call(p.querySelectorAll('[role="tab"]'));
      var idx = tabs.indexOf(this);
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        var n = tabs[(idx + 1) % tabs.length];
        n.click();
        n.focus();
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        var pv = tabs[(idx - 1 + tabs.length) % tabs.length];
        pv.click();
        pv.focus();
      }
    });
  });
}

// ============================================================
// 悬浮微型播放器
// ============================================================
(function(){
    var audio = document.getElementById('bgMusic');
    var playIcon = document.getElementById('playIcon');
    var pauseIcon = document.getElementById('pauseIcon');
    var player = document.getElementById('floatingPlayer');
    var hint = document.getElementById('playHint');
    var isPlaying = false;
    var autoPlayFailed = false;

    function togglePlay() {
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
        } else {
            audio.play().then(function() {
                isPlaying = true;
                hint.classList.remove('show');
            }).catch(function(e) {
                alert('无法播放音乐，请检查网络连接。');
                isPlaying = false;
            });
        }
        updateUI();
    }

    function updateUI() {
        if (isPlaying) {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            player.classList.add('is-playing');
            hint.classList.remove('show');
        } else {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            player.classList.remove('is-playing');
            if (autoPlayFailed) {
                hint.classList.add('show');
            }
        }
    }

    player.addEventListener('click', togglePlay);

    audio.play().then(function() {
        isPlaying = true;
        autoPlayFailed = false;
        updateUI();
    }).catch(function(e) {
        autoPlayFailed = true;
        isPlaying = false;
        updateUI();
        var playOnClick = function() {
            audio.play().then(function() {
                isPlaying = true;
                autoPlayFailed = false;
                updateUI();
                document.removeEventListener('click', playOnClick);
            }).catch(function(e2) {});
        };
        document.addEventListener('click', playOnClick);
    });

    updateUI();

    window.musicPlayer = {
        toggle: togglePlay,
        isPlaying: function() { return isPlaying; }
    };
})();
